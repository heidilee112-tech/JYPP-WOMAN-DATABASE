<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JYPP 투자 현황</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;600;700&display=swap');

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Noto Sans KR', -apple-system, BlinkMacSystemFont, sans-serif;
      background: #ffffff;
      color: #1a1a1a;
      line-height: 1.7;
      -webkit-font-smoothing: antialiased;
    }

    /* ── Header ── */
    header {
      border-bottom: 1px solid #e8e8e8;
      background: #fff;
      position: sticky;
      top: 0;
      z-index: 100;
    }
    .header-inner {
      max-width: 1080px;
      margin: 0 auto;
      padding: 20px 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .logo {
      font-size: 20px;
      font-weight: 700;
      color: #1a1a1a;
      letter-spacing: -0.5px;
    }
    .logo span { color: #009BE6; }
    .logo a {
      color: inherit;
      text-decoration: none;
    }
    .back-link {
      font-size: 13px;
      color: #888;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 4px;
      transition: color 0.15s;
    }
    .back-link:hover { color: #009BE6; }

    /* ── Main ── */
    main {
      max-width: 1080px;
      margin: 0 auto;
      padding: 40px 24px 80px;
    }
    .section-label {
      display: inline-block;
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      color: #009BE6;
      margin-bottom: 8px;
    }
    .section-title {
      font-size: 24px;
      font-weight: 700;
      color: #1a1a1a;
      margin-bottom: 32px;
      letter-spacing: -0.5px;
    }

    /* ── 비밀번호 화면 ── */
    .password-screen {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 400px;
      gap: 20px;
    }
    .lock-icon {
      width: 56px;
      height: 56px;
      background: #E6F4FD;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 24px;
      color: #009BE6;
    }
    .password-screen p {
      font-size: 15px;
      color: #666;
    }
    .password-form {
      display: flex;
      gap: 8px;
    }
    .password-form input {
      width: 220px;
      padding: 10px 16px;
      border: 1px solid #ddd;
      border-radius: 8px;
      font-size: 14px;
      font-family: 'Noto Sans KR', sans-serif;
      outline: none;
      transition: border-color 0.2s;
    }
    .password-form input:focus {
      border-color: #009BE6;
    }
    .password-form input.error {
      border-color: #ef4444;
      animation: shake 0.4s;
    }
    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      25% { transform: translateX(-6px); }
      75% { transform: translateX(6px); }
    }
    .password-form button {
      padding: 10px 24px;
      background: #009BE6;
      color: #fff;
      border: none;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 600;
      font-family: 'Noto Sans KR', sans-serif;
      cursor: pointer;
      transition: background 0.2s;
    }
    .password-form button:hover {
      background: #0088CC;
    }
    .error-msg {
      font-size: 13px;
      color: #ef4444;
      height: 18px;
    }

    /* ── 검토 중 기업 ── */
    .review-section {
      display: none;
      margin-bottom: 48px;
    }
    .review-section.visible {
      display: block;
    }
    .review-section h3 {
      font-size: 18px;
      font-weight: 700;
      color: #1a1a1a;
      margin-bottom: 16px;
      letter-spacing: -0.3px;
    }
    .review-section h3 .count {
      font-size: 13px;
      font-weight: 500;
      color: #009BE6;
      margin-left: 8px;
    }
    .review-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 14px;
    }
    .review-table thead th {
      text-align: left;
      padding: 10px 16px;
      background: #f7fbfe;
      color: #555;
      font-weight: 600;
      font-size: 13px;
      border-bottom: 2px solid #009BE6;
    }
    .review-table tbody td {
      padding: 12px 16px;
      border-bottom: 1px solid #f0f0f0;
      color: #333;
    }
    .review-table tbody tr:hover {
      background: #fafcfe;
    }
    .review-loading {
      text-align: center;
      padding: 24px;
      color: #999;
      font-size: 13px;
    }
    .review-divider {
      width: 100%;
      height: 1px;
      background: #e8e8e8;
      margin-bottom: 32px;
    }
    .sheet-label {
      font-size: 18px;
      font-weight: 700;
      color: #1a1a1a;
      margin-bottom: 16px;
      letter-spacing: -0.3px;
    }

    /* ── 스프레드시트 영역 ── */
    .sheet-container {
      display: none;
    }
    .sheet-container.visible {
      display: block;
    }
    .sheet-container iframe {
      width: 100%;
      height: 700px;
      border: 1px solid #e8e8e8;
      border-radius: 12px;
    }

    /* ── Footer ── */
    footer {
      border-top: 1px solid #e8e8e8;
      text-align: center;
      padding: 32px 24px;
      font-size: 12px;
      color: #bbb;
    }

    @media (max-width: 768px) {
      .section-title { font-size: 20px; }
      .sheet-container iframe { height: 500px; }
      .password-form { flex-direction: column; }
      .password-form input { width: 100%; }
    }
  </style>
</head>
<body>

  <!-- Header -->
  <header>
    <div class="header-inner">
      <div class="logo"><a href="index.html"><span>JYPP</span> 여성기업 트렌드</a></div>
      <a href="index.html" class="back-link">&larr; 메인으로 돌아가기</a>
    </div>
  </header>

  <!-- Main -->
  <main>
    <div class="section-label">Investment</div>
    <h2 class="section-title">JYPP 투자 현황</h2>

    <!-- 비밀번호 입력 -->
    <div class="password-screen" id="passwordScreen">
      <div class="lock-icon">&#128274;</div>
      <p>이 페이지는 비밀번호로 보호되어 있습니다.</p>
      <div class="password-form">
        <input type="password" id="pwInput" placeholder="비밀번호를 입력하세요" autocomplete="off">
        <button onclick="checkPassword()">확인</button>
      </div>
      <div class="error-msg" id="errorMsg"></div>
    </div>

    <!-- 검토 중 기업 -->
    <div class="review-section" id="reviewSection">
      <h3>JYPP 검토 중 기업 <span class="count" id="reviewCount"></span></h3>
      <div id="reviewContent">
        <div class="review-loading">데이터를 불러오는 중...</div>
      </div>
      <div class="review-divider"></div>
    </div>

    <!-- 스프레드시트 -->
    <div class="sheet-container" id="sheetContainer">
      <h3 class="sheet-label">전체 투자 현황</h3>
      <iframe
        id="sheetFrame"
        src=""
        frameborder="0"
        allowfullscreen>
      </iframe>
    </div>
  </main>

  <footer>
    &copy; 2026 JYPP &middot; 투자 현황 &middot; 내부 자료
  </footer>

  <script>
    const SHEET_URL = 'https://docs.google.com/spreadsheets/d/1khkxVaEbw1fe3IJzXQRngDTVmJ7ddUDT-VnoJ-AuBxU/edit?usp=sharing&rm=minimal';

    const pwInput = document.getElementById('pwInput');
    const errorMsg = document.getElementById('errorMsg');

    pwInput.addEventListener('keydown', function(e) {
      if (e.key === 'Enter') checkPassword();
    });

    function checkPassword() {
      const pw = pwInput.value;
      if (pw === 'jypp2026') {
        document.getElementById('passwordScreen').style.display = 'none';

        // 검토 중 기업 섹션 표시 & 데이터 로드
        document.getElementById('reviewSection').classList.add('visible');
        loadReviewData();

        // 스프레드시트 표시
        const container = document.getElementById('sheetContainer');
        container.classList.add('visible');
        document.getElementById('sheetFrame').src = SHEET_URL;
      } else {
        errorMsg.textContent = '비밀번호가 올바르지 않습니다.';
        pwInput.classList.add('error');
        setTimeout(() => pwInput.classList.remove('error'), 400);
      }
    }

    function loadReviewData() {
      const SHEET_ID = '1khkxVaEbw1fe3IJzXQRngDTVmJ7ddUDT-VnoJ-AuBxU';
      const query = encodeURIComponent("SELECT C, D, J WHERE O = '검토 중'");
      const url = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:json&tq=${query}`;

      fetch(url)
        .then(res => res.text())
        .then(text => {
          // Google returns JSONP-like response: google.visualization.Query.setResponse({...})
          const json = JSON.parse(text.substring(text.indexOf('{'), text.lastIndexOf('}') + 1));
          const rows = json.table.rows;
          const cols = json.table.cols;

          if (rows.length === 0) {
            document.getElementById('reviewContent').innerHTML =
              '<p style="color:#999; font-size:14px; padding:16px 0;">현재 검토 중인 기업이 없습니다.</p>';
            return;
          }

          document.getElementById('reviewCount').textContent = `${rows.length}건`;

          let html = '<table class="review-table"><thead><tr>';
          html += '<th>기업명</th><th>분야</th><th>투자형태</th>';
          html += '</tr></thead><tbody>';

          rows.forEach(row => {
            const name = row.c[0] ? row.c[0].v : '-';
            const field = row.c[1] ? row.c[1].v : '-';
            const type = row.c[2] ? row.c[2].v : '-';
            html += `<tr><td>${name}</td><td>${field}</td><td>${type}</td></tr>`;
          });

          html += '</tbody></table>';
          document.getElementById('reviewContent').innerHTML = html;
        })
        .catch(err => {
          document.getElementById('reviewContent').innerHTML =
            '<p style="color:#ef4444; font-size:13px;">데이터를 불러오지 못했습니다. 스프레드시트 공유 설정을 확인해주세요.</p>';
        });
    }
  </script>

</body>
</html>
