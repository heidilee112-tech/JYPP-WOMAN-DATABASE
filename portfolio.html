<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JYPP 투자기업 최신뉴스</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;600;700&display=swap');

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Noto Sans KR', -apple-system, BlinkMacSystemFont, sans-serif;
      background: #ffffff;
      color: #1a1a1a;
      line-height: 1.7;
      -webkit-font-smoothing: antialiased;
    }

    /* ── Header ── */
    header {
      border-bottom: 1px solid #e8e8e8;
      background: #fff;
      position: sticky;
      top: 0;
      z-index: 100;
    }
    .header-inner {
      max-width: 1080px;
      margin: 0 auto;
      padding: 20px 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .logo {
      font-size: 20px;
      font-weight: 700;
      color: #1a1a1a;
      letter-spacing: -0.5px;
    }
    .logo span { color: #009BE6; }
    .logo a {
      color: inherit;
      text-decoration: none;
    }
    .back-link {
      font-size: 13px;
      color: #888;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 4px;
      transition: color 0.15s;
    }
    .back-link:hover { color: #009BE6; }

    /* ── Main ── */
    main {
      max-width: 1080px;
      margin: 0 auto;
      padding: 40px 24px 80px;
    }

    /* ── Section Title ── */
    .section-label {
      display: inline-block;
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      color: #009BE6;
      margin-bottom: 8px;
    }
    .section-title {
      font-size: 24px;
      font-weight: 700;
      color: #1a1a1a;
      margin-bottom: 32px;
      letter-spacing: -0.5px;
    }

    /* ── 뉴스 컬럼 ── */
    .news-grid {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 40px;
    }
    .news-column h3 {
      font-size: 15px;
      font-weight: 600;
      color: #009BE6;
      margin-bottom: 20px;
      padding-bottom: 12px;
      border-bottom: 2px solid #009BE6;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .news-column h3 .badge {
      font-size: 11px;
      background: #009BE6;
      color: #fff;
      padding: 2px 8px;
      border-radius: 10px;
      font-weight: 500;
    }
    .news-item {
      padding: 16px 0;
      border-bottom: 1px solid #f0f0f0;
      transition: all 0.15s;
    }
    .news-item:last-child {
      border-bottom: none;
    }
    .news-item:hover {
      background: #fafafa;
      margin: 0 -12px;
      padding: 16px 12px;
      border-radius: 8px;
    }
    .news-meta {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 6px;
    }
    .news-item .news-date {
      font-size: 12px;
      color: #999;
      font-weight: 400;
    }
    .news-item .news-source {
      font-size: 11px;
      color: #bbb;
      background: #f5f5f5;
      padding: 1px 8px;
      border-radius: 3px;
    }
    .news-item .news-title {
      font-size: 15px;
      font-weight: 500;
      color: #1a1a1a;
      line-height: 1.5;
      margin-bottom: 4px;
    }
    .news-item .news-title a {
      color: #1a1a1a;
      text-decoration: none;
    }
    .news-item .news-title a:hover {
      color: #009BE6;
      text-decoration: underline;
    }
    .news-item .news-summary {
      font-size: 13px;
      color: #777;
      line-height: 1.6;
    }

    /* ── Footer ── */
    footer {
      border-top: 1px solid #e8e8e8;
      text-align: center;
      padding: 32px 24px;
      font-size: 12px;
      color: #bbb;
    }

    /* ── Responsive ── */
    @media (max-width: 900px) {
      .news-grid { grid-template-columns: 1fr; gap: 32px; }
      .section-title { font-size: 20px; }
    }
  </style>
</head>
<body>

  <!-- Header -->
  <header>
    <div class="header-inner">
      <div class="logo"><a href="index.html"><span>JYPP</span> 여성기업 트렌드</a></div>
      <a href="index.html" class="back-link">&larr; 메인으로 돌아가기</a>

  </main>

    // ── 뉴스 렌더링 ──
    function renderNews(containerId, data) {
      const container = document.getElementById(containerId);
      container.innerHTML = data.map(item => `
        <div class="news-item">
          <div class="news-meta">
            <span class="news-date">${item.date}</span>
            <span class="news-source">${item.source}</span>
          </div>
          <div class="news-title"><a href="${item.url}" target="_blank" rel="noopener">${item.title}</a></div>
          <div class="news-summary">${item.summary}</div>
        </div>
      `).join('');
    }

    renderNews('mediquitousNews', mediquitousData);
    renderNews('mrpapaNews', mrpapaData);
    renderNews('abetterNews', abetterData);

</html>
